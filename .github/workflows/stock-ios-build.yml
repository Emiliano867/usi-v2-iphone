name: Stock iPhUMI unsigned iOS build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned-device-build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UPSTREAM_COMMIT: 1e9e622e77ad32990c42f839e12212d2a995faf9
      COCOAPODS_VERSION: 1.16.2
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the unchanged upstream application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: real-stanford/iPhUMI
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: stock
          persist-credentials: false

      - name: Record source and toolchain provenance
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test -d "$DEVELOPER_DIR"
          test "$(git -C stock rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          {
            printf 'upstream_commit=%s\n' "$UPSTREAM_COMMIT"
            printf 'workflow_commit=%s\n' "$GITHUB_SHA"
            printf 'runner_image=%s\n' "${ImageVersion:-unknown}"
            sw_vers
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            ruby --version
            shasum -a 256 stock/ios_app/Podfile.lock
          } | tee artifacts/provenance.txt

      - name: Install the locked CocoaPods dependencies
        working-directory: stock/ios_app
        run: |
          set -euo pipefail
          gem install cocoapods --version "$COCOAPODS_VERSION" --user-install --no-document
          export PATH="$(ruby -r rubygems -e 'puts Gem.user_dir')/bin:$PATH"
          pod "_${COCOAPODS_VERSION}_" --version | tee ../../artifacts/cocoapods-version.txt
          pod "_${COCOAPODS_VERSION}_" install --deployment 2>&1 | tee ../../artifacts/pod-install.log
          git diff --exit-code -- Podfile Podfile.lock
          cp Podfile.lock ../../artifacts/Podfile.lock
          xcodebuild -list -json -workspace iPhUMI.xcworkspace > ../../artifacts/schemes.json

      - name: Archive a generic iOS device build without signing
        working-directory: stock/ios_app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace iPhUMI.xcworkspace \
            -scheme iPhUMI \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/iphumi-derived" \
            -archivePath "$RUNNER_TEMP/iPhUMI.xcarchive" \
            -resultBundlePath "$GITHUB_WORKSPACE/artifacts/iPhUMI.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/xcodebuild.log"

      - name: Package and inspect the unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/iPhUMI.xcarchive/Products/Applications/iPhUMI.app"
          test -f "$app/Info.plist"
          test -f "$app/iPhUMI"
          file "$app/iPhUMI" | tee artifacts/executable.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist" > artifacts/bundle-identifier.txt
          mkdir -p "$RUNNER_TEMP/iphumi-package/Payload"
          ditto "$app" "$RUNNER_TEMP/iphumi-package/Payload/iPhUMI.app"
          (
            cd "$RUNNER_TEMP/iphumi-package"
            ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/artifacts/iPhUMI-stock-unsigned.ipa"
          )
          unzip -t artifacts/iPhUMI-stock-unsigned.ipa > artifacts/ipa-integrity.txt
          shasum -a 256 artifacts/iPhUMI-stock-unsigned.ipa > artifacts/ipa-sha256.txt
          printf '%s\n' 'UNSIGNED: build and ZIP checks only. Signing, installation, ARKit, BLE and USB streaming have NOT been tested.' > artifacts/STATUS.txt

      - name: Retain the IPA and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iphumi-stock-unsigned-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
