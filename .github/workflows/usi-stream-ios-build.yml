name: Suction UMI v2 iOS build

on:
  workflow_dispatch:
    inputs:
      run_layout_checks:
        description: 'Run slower simulator layout screenshots (optional)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: usi-stream-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  custom-device-build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      COCOAPODS_VERSION: 1.16.2
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this custom application revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record source and toolchain provenance
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test -d "$DEVELOPER_DIR"
          {
            git rev-parse HEAD
            printf 'upstream_base=1e9e622e77ad32990c42f839e12212d2a995faf9\n'
            printf 'runner_image=%s\n' "${ImageVersion:-unknown}"
            sw_vers
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            swift --version
            python3 --version
          } | tee artifacts/provenance.txt

      - name: Test Python protocols and USB receiver
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/usi-python"
          "$RUNNER_TEMP/usi-python/bin/python" -m pip install 'pytest==8.3.5'
          "$RUNNER_TEMP/usi-python/bin/python" -B -m pytest tests/test_*.py -q 2>&1 | tee artifacts/python-tests.log

      - name: Test Swift framing against the shared wire fixture
        run: |
          set -euo pipefail
          swift test 2>&1 | tee artifacts/swift-tests.log

      - name: Install locked CocoaPods dependencies
        working-directory: ios_app
        run: |
          set -euo pipefail
          gem install cocoapods --version "$COCOAPODS_VERSION" --user-install --no-document
          export PATH="$(ruby -r rubygems -e 'puts Gem.user_dir')/bin:$PATH"
          pod "_${COCOAPODS_VERSION}_" install --deployment 2>&1 | tee ../artifacts/pod-install.log
          git diff --exit-code -- Podfile Podfile.lock
          cp Podfile.lock ../artifacts/Podfile.lock

      - name: Check native landscape layout and larger text
        if: ${{ inputs.run_layout_checks }}
        run: |
          set -euo pipefail
          bash tests/ios-layout/run.sh "$GITHUB_WORKSPACE/artifacts/layout" 2>&1 | tee artifacts/layout-tests.log

      - name: Archive the custom USI Stream app without signing
        working-directory: ios_app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace iPhUMI.xcworkspace -scheme iPhUMI -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/usi-derived" \
            -archivePath "$RUNNER_TEMP/USIStream.xcarchive" \
            -resultBundlePath "$GITHUB_WORKSPACE/artifacts/USIStream.xcresult" \
            CURRENT_PROJECT_VERSION="7.${GITHUB_RUN_NUMBER}" \
            USI_UI_REVISION="${GITHUB_SHA:0:7}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/xcodebuild.log"

      - name: Validate metadata and package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/USIStream.xcarchive/Products/Applications/iPhUMI.app"
          test -f "$app/iPhUMI"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          test "$bundle_id" = 'com.emiliano867.suctionumiv2'
          printf '%s\n' "$bundle_id" > artifacts/bundle-identifier.txt
          display_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")
          test "$display_name" = 'Suction UMI v2'
          printf '%s\n' "$display_name" > artifacts/bundle-display-name.txt
          build_number=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")
          test -n "$build_number"
          printf '%s\n' "$build_number" > artifacts/bundle-build-version.txt
          mkdir -p "$RUNNER_TEMP/usi-package/Payload"
          ditto "$app" "$RUNNER_TEMP/usi-package/Payload/iPhUMI.app"
          (
            cd "$RUNNER_TEMP/usi-package"
            ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/artifacts/Suction-UMI-v2-recording.ipa"
          )
          unzip -t artifacts/Suction-UMI-v2-recording.ipa > artifacts/ipa-integrity.txt
          shasum -a 256 artifacts/Suction-UMI-v2-recording.ipa > artifacts/ipa-sha256.txt
          printf '%s\n' 'Core collection with selectable 30/60 FPS (default 30): ARKit RGB/depth/confidence/pose plus BLE pressure/trigger/clocks over USB port 5559; host-acknowledged Start/Stop and verified MCAP Saved. Includes measured seal calibration. Ultrawide and calibrated tool TCP remain unavailable. Native build success does not establish a physical recording; run the phone/Ubuntu trial and inspect verification.json.' > artifacts/STATUS.txt

      - name: Retain diagnostic evidence and unsigned IPA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: suction-umi-v2-recording-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
